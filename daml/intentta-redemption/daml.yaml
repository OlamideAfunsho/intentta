sdk-version: 3.4.11
name: intentta-redemption-v1
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # DecMan: only the GovernableAction interface is a build-time dependency.
  - ../dars/governance-action-v1-0.1.0.dar
  # Canton Token Standard (CIP-0056) interfaces, the same package ids the
  # Registry DAR was compiled against.
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  # DA Registry: BurnOffer / AllocationFactory_OfferBurn for the share leg.
  - ../dars/utility-registry-app-v0-0.7.0.dar
  - ../dars/utility-registry-holding-v0-0.2.1.dar
build-options:
  - --target=2.2
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
