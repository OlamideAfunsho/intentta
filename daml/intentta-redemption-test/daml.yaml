sdk-version: 3.4.11
name: intentta-redemption-test
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../intentta-redemption/.daml/dist/intentta-redemption-v1-0.1.0.dar
  - ../intentta-issuer-setup/.daml/dist/intentta-issuer-setup-v1-0.1.0.dar
  # Real DecMan governance engine and action interface (release v1).
  - ../dars/governance-action-v1-0.1.0.dar
  - ../dars/governance-core-v1-0.1.0.dar
  # DecMan's Registry test library: operator / registrar / instrument setup.
  - ../dars/testlib-0.1.0.dar
  - ../dars/splice-amulet-0.1.17.dar
  - ../dars/splice-api-featured-app-v1-1.0.0.dar
  - ../dars/splice-api-token-burn-mint-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../dars/splice-util-0.1.4.dar
  - ../dars/utility-credential-v0-0.1.0.dar
  - ../dars/utility-registry-app-v0-0.7.0.dar
  - ../dars/utility-registry-holding-v0-0.2.1.dar
  - ../dars/utility-registry-v0-0.6.0.dar
build-options:
  - --target=2.2
  - -Wno-upgrade-interfaces
  - -Wno-template-interface-depends-on-daml-script
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
