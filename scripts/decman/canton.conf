// Four participants on one synchronizer, for running real DecMan nodes
// locally. Participants 1 to 3 belong to the three committee members and
// together host the issuer as a decentralized (multi-hosted, threshold)
// party. Participant 4 hosts the investors and the Registry-side parties, so
// what an investor's node sees can be compared with what the issuer's see.
//
// Ledger API auth is the unsafe shared-secret mode DecMan's --insecure flag
// expects. It is for a throwaway local network only.
canton {
  parameters {
    non-standard-config = yes
    alpha-version-support = yes
  }
  // DecMan signs with the owner keys held by each participant, which Canton
  // exposes only with preview commands enabled.
  features {
    enable-preview-commands = yes
    enable-testing-commands = yes
  }

  sequencers.sequencer1 {
    parameters.alpha-version-support = true
    public-api { address = "0.0.0.0", port = 5108 }
    admin-api { address = "0.0.0.0", port = 5109 }
    storage.type = memory
    sequencer { type = reference, config.storage.type = memory }
  }

  mediators.mediator1 {
    admin-api { address = "0.0.0.0", port = 5209 }
    storage.type = memory
  }

  participants {
    participant1 = ${_participant} {
      ledger-api.port = 5001
      admin-api.port = 5002
      http-ledger-api.port = 5003
    }
    participant2 = ${_participant} {
      ledger-api.port = 5011
      admin-api.port = 5012
      http-ledger-api.port = 5013
    }
    participant3 = ${_participant} {
      ledger-api.port = 5021
      admin-api.port = 5022
      http-ledger-api.port = 5023
    }
    participant4 = ${_participant} {
      ledger-api.port = 5031
      admin-api.port = 5032
      http-ledger-api.port = 5033
    }
  }
}

_participant {
  parameters.alpha-version-support = true
  storage.type = memory
  admin-api.address = "0.0.0.0"
  http-ledger-api.address = "0.0.0.0"
  ledger-api {
    address = "0.0.0.0"
    user-management-service.enabled = true
    // DecMan's insecure-mode token carries no expiry.
    max-token-lifetime = Inf
    auth-services = [{
      type = unsafe-jwt-hmac-256
      secret = "unsafe" // secret-scan: allow (Canton's documented placeholder for unsafe local auth)
      target-audience = "https://canton.network.global"
    }]
  }
}
